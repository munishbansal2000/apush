    correct: "Indentured servants declined in the Chesapeake after Bacon's Rebellion — planters found them politically fractious, and northern colonies offered better terms (5steps). The Dutch slave-trade monopoly ended in 1682, lowering prices for enslaved Africans in the English colonies (5steps)."
