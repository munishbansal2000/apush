  - id: F-U2-011
    topic: Barbados slave code 1661 — the legal template
    correct: "Barbados, 1661: one of the first comprehensive slave codes in English America — it stripped all rights from enslaved Blacks and granted white planters complete power over them. Caribbean planters adopted it, and the codes were later adopted in the southern mainland colonies."
