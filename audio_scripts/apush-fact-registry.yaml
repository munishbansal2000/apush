    correct: "After the revolt Spain ruled differently: a public defender was appointed to protect Pueblo rights in Spanish courts, each Pueblo family was granted land under Spanish law, and Pueblo cultural practices/ceremonies were tolerated (premium2027, Tier 1). Princeton (Tier 1): the Spanish were 'more accommodating... the fear of continued conflicts driving the need for compromise.' Frame as fear, not kindness."
