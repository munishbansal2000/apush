  - id: F-U2-013
    topic: Bacon's Rebellion as the servitude-to-slavery turning point; racism/slavery causation debated
    correct: "Historians view Bacon's Rebellion as a key event in the shift from indentured servitude to slavery as the main labor form in the South: elite planters turned increasingly to enslaved Africans afterward (prem27). Whether racism toward Africans developed as a result of enslavement, or racist notions predated and allowed for enslavement, is a live historians' debate — always present both sides, never teach one direction as settled. Morgan's thesis (American Slavery, American Freedom): planters used racial division to subdue class conflict."
    falsehoods:
      - "racism caused slavery.{0,40}(settled|certainly|definitely)"
      - "slavery caused racism.{0,40}(settled|certainly|definitely)"
      - "codes first.{0,15}race after"
    sources: [prem27]

