facts:
- id: F-CIV-001
  topic: Union material advantage
  correct: The North had more than twice the population (~22M vs ~9M) and over 85%
    of the factories. About 3.5M of the South's 9M were enslaved.
  falsehoods:
  - five times the population
  - 5x the population
  sources:
  - prem27
  - 5steps
  - web
- id: F-CIV-002
  topic: Why the cotton bet failed
  correct: 'Britain did not intervene for Southern cotton: it had a huge surplus stockpiled
    in 1861, depended on Northern grain, and could expand supply from Egypt and India.
    (The Crown took direct rule of India in 1858 after a century of East India Company
    control — Britain did not ''take India'' in 1858.)'
  falsehoods:
  - britain had taken india in 1858
  - britain took india in 1858
  - took india in 1858
  sources:
  - prem27
  - web
- id: F-CIV-003
  topic: Emancipation Proclamation timing
  correct: Antietam (Sept 1862) led to the PRELIMINARY Emancipation Proclamation (Sept
    22, 1862); the final proclamation took effect Jan 1, 1863. It freed enslaved people
    in rebelling states only — not in the border states, not everywhere.
  falsehoods:
  - emancipation proclamation freed all (the )?enslaved
  - freed all the slaves
  sources:
  - norris
  - prem27
  - 5steps
  - web
- id: F-CIV-004
  topic: Confederate invasions of the North
  correct: After Gettysburg the South never mounted another MAJOR invasion of the
    North — but Early's 1864 raid reached the outskirts of Washington (Fort Stevens,
    July 1864).
  falsehoods:
  - never invades? the north again
  - never invaded the north again
  sources:
  - prem27
  - web
- id: F-CIV-005
  topic: Civil War draft — commutation vs substitution
  correct: The $300 was the COMMUTATION fee (buying your way out); hiring a SUBSTITUTE
    was a separate, usually pricier option. Do not conflate them.
  falsehoods:
  - \$300 substitute fee
  - three-hundred-dollar substitute fee
  - 300-dollar substitute fee
  sources:
  - prem27
  - web
- id: F-CIV-006
  topic: Twenty Negro Law
  correct: The Confederate exemption covered one white man per plantation with 20
    OR MORE enslaved people — not 'one planter per twenty enslaved people.'
  falsehoods:
  - one white planter for every twenty
  - one planter for every twenty
  sources:
  - prem27
  - web
- id: F-CIV-007
  topic: Habeas corpus suspensions
  correct: Lincoln's habeas corpus suspensions led to arrests of mostly civilians,
    many in the border states — the arrest population included deserters, draft resisters,
    and civilians accused of disloyalty. Do not overclaim precision about who was/wasn't
    taken.
  falsehoods: []
  sources:
  - prem27
  - web
- id: F-CIV-008
  topic: First Bull Run
  correct: At Bull Run the Union plan was too complex for green troops; McDowell was
    a West Pointer, not a political appointee. Washington civilians did ride out to
    watch.
  falsehoods:
  - mcdowell was a political appointee
  - mcdowell, a political appointee
  sources:
  - prem27
  - web
- id: F-CIV-009
  topic: Vicksburg siege length
  correct: The siege of Vicksburg ran about six weeks, May 18 to July 4, 1863 — not
    two months.
  falsehoods:
  - vicksburg for two months
  - siege of vicksburg.*two months
  - besieged vicksburg for two months
  sources:
  - prem27
  - 5steps
  - web
- id: F-CIV-010
  topic: Atlanta fall vs burning
  correct: Atlanta fell to Sherman in September 1864 and was burned in November as
    he left for the March to the Sea. Two events, two months apart.
  falsehoods: []
  sources:
  - prem27
  - web
- id: F-CIV-011
  topic: Civil War death toll
  correct: 'Hedge the NUMBER, not the comparison: ''one recent estimate puts it near
    700,000.'' The 698k figure (Barceló et al., PNAS Nov 2024, refining Hacker''s
    method; Hacker 2011: 750,000) is contested — published estimates span 618k–850k.'
  falsehoods:
  - about 698,000, by the latest.*definitive
  - exactly 698,000
  sources:
  - web
- id: F-CIV-013
  topic: Sherman's hard/total war — a live historians' debate, not a flat fact
  correct: 'Sherman''s weapon was hard war (what AP calls total war): destroying the
    South''s economic base AND its civilians'' will to back the war. Crops, rails,
    workshops. Not massacre, but not gentle either — he ordered Atlanta''s civilians
    out of the city, and ''make Georgia howl'' was explicitly about civilian morale.
    Never present ''never targeted civilians'' as a flat right answer; the stimulus-style
    framing is: evidence for (evacuation, destroyed civilian property) vs evidence
    complicating it (orders aimed at military-useful property, few civilians killed).'
  falsehoods:
  - total war means everyone suffers
  - property and infrastructure, never civilians
  - never targeted civilians
  sources:
  - prem27
  - britannica
- id: F-CIV-014
  topic: Antietam casualties
  correct: 'Antietam (Sept 17, 1862): ~23,000 casualties, bloodiest single day in
    American history. It gave Lincoln the opening for the preliminary Emancipation
    Proclamation.'
  falsehoods: []
  sources:
  - norris
  - prem27
  - 5steps
  - web
- id: F-CIV-015
  topic: Gettysburg and Vicksburg dates
  correct: 'Gettysburg: July 1–3, 1863 (Pickett''s Charge ~12,500 men). Vicksburg
    surrendered July 4, 1863 — the same week. Little Round Top: Chamberlain''s bayonet
    charge, Medal of Honor.'
  falsehoods: []
  sources:
  - norris
  - prem27
  - 5steps
  - web
- id: F-CIV-016
  topic: 1864 election
  correct: 'Atlanta''s fall (Sept 1864) helped save Lincoln''s reelection against
    McClellan. Nuance: the DEMOCRATIC PLATFORM called the war a failure and demanded
    negotiations, but McClellan himself publicly disowned that plank and said he''d
    fight on for Union. Correct framing: ''The Democratic platform called the war
    a failure. McClellan himself disowned that plank, but a Democratic win would have
    emboldened the peace movement'' → ''might have opened the door to a negotiated
    peace'' (not ''ended the war with the Confederacy intact''). Never call McClellan
    flatly ''the peace candidate.'''
  falsehoods:
  - ran as the peace candidate
  - mcclellan, the peace candidate
  sources:
  - princeton
  - britannica
- id: F-CIV-017
  topic: Richmond bread riot
  correct: 'Richmond bread riot: 1863. Name it and date it; don''t strand it as an
    anonymous ''bread riots'' aside.'
  falsehoods: []
  sources:
  - prem27
  - web
- id: F-CIV-018
  topic: Appomattox and assassination
  correct: Lee surrendered at Appomattox Court House on April 9, 1865, on generous
    terms. Lincoln was assassinated five days later (April 14/15).
  falsehoods: []
  sources:
  - norris
  - prem27
  - 5steps
  - web
- id: F-CIV-019
  topic: Cold Harbor casualties — killed vs wounded, and the figure is disputed
  correct: 'Cold Harbor (June 3, 1864): Union casualties were heavy in the first hour
    — say ''thousands in the first hour,'' never a precise figure (the ~7,000 killed-or-wounded
    figure is contested). Never state casualties as deaths.'
  falsehoods:
  - kills something like seven thousand union soldiers
  - seven thousand union soldiers (were )?killed at cold harbor
  - 7,000 union soldiers killed at cold harbor
  sources:
  - nps
  - britannica
- id: F-CIV-020
  topic: Richmond bread riot — Davis detail is contested
  correct: 'Richmond bread riot: April 1863, real and well-documented. But the detail
    that Jefferson Davis personally faced the crowd is contested across witness accounts
    — always hedge (''by some accounts'') or cut it.'
  falsehoods: []
  sources:
  - norris
- id: F-CIV-021
  topic: Atlanta evacuation + "make Georgia howl" (Q3 stimulus evidence)
  correct: Sherman ordered Atlanta's civilian population evacuated on taking the city
    (Special Field Orders No. 67, Sept 14, 1864). 'Make Georgia howl' is from his
    Oct 9, 1864 telegram to Grant — AFTER Atlanta's September fall, BEFORE the March
    to the Sea (mid-November). It belongs narratively with the March, not before Atlanta.
    Both are verified; they are the 'supports' evidence for the Sherman stimulus SAQ.
  falsehoods: []
  sources:
  - nps
  - britannica
- id: F-CIV-022
  topic: Lincoln's blind memorandum, August 1864
  correct: 'On August 23, 1864, Lincoln wrote a sealed memorandum stating it seemed
    ''exceedingly probable'' he would not be reelected, and had cabinet members sign
    it sight unseen. Use as the prediction-beat hook for the 1864 election — stronger
    than ''Lincoln privately expected to lose.'' (Primary holder: Library of Congress,
    which quotes the memo verbatim.)'
  falsehoods: []
  sources:
  - britannica
- id: F-CIV-024
  topic: Black soldiers in the Civil War (next lesson's content — teaser commits to
    it)
  correct: 'About 180,000 Black soldiers served in the Union army by war''s end (Britannica:
    ''about 180,000 African Americans were in the army''; ''nearly 180,000 Black troops
    had enlisted''). The 54th Massachusetts (Col. Robert Gould Shaw, Fort Wagner,
    1863) is the famous regiment. Teased in U5-E7; belongs to the Emancipation lesson.'
  falsehoods: []
  sources:
  - britannica
- id: F-CIV-023
  topic: Grant's reputation — Fort Donelson and Vicksburg, not Shiloh alone
  correct: Grant's reputation was set at Fort Donelson ('unconditional surrender,'
    Feb 1862) and Vicksburg. The reported Lincoln remark 'I can't spare this man,
    he fights' dates from AFTER SHILOH (April 1862), when critics demanded Grant's
    removal — place it there, with 'reportedly.'
  falsehoods: []
  sources:
  - nps
- id: F-LP-001
  topic: Spain's protest of the Louisiana Purchase
  correct: 'Spain''s protest of the sale is real, but nuanced: the no-transfer pledge
    was in a diplomatic note, and France disputed its treaty force. Present the protest
    as undisputed, the pledge''s legal force as contested.'
  falsehoods: []
  sources:
  - web
  - princeton
- id: F-LP-002
  topic: Louisiana transfer dates
  correct: Spain transferred Louisiana to France at New Orleans on Nov 30, 1803; the
    US took possession Dec 20, 1803 — twenty days later. The 'three flags in twenty
    days' framing is accurate.
  falsehoods: []
  sources:
  - web
- id: F-LP-003
  topic: Adams-Onís Treaty
  correct: Adams–Onís (1819) settled the US–Spain border and transferred Florida to
    the US. It belongs with the purchase's aftermath, not as a purchase term.
  falsehoods: []
  sources:
  - princeton
  - web
- id: F-LP-004
  topic: Louisiana Purchase boundaries
  correct: The purchase's boundaries were unspecified at the time of sale — this is
    why the boundary dispute (and Adams–Onís) matters.
  falsehoods: []
  sources:
  - prem27
  - web
- id: F-LP-005
  topic: Jefferson's Breckinridge letter quote (Aug 12, 1803)
  correct: 'Jefferson''s private letter to John C. Breckinridge (Aug 12, 1803): ''The
    constitution has made no provision for our holding foreign territory, still less
    for incorporating foreign nations into our union'' — he admitted the purchase
    went ''beyond the Constitution'' and leaned on the treaty power. Wording confirmed
    across transcriptions citing the LOC Jefferson Papers; disclose as reported wording.'
  falsehoods: []
  sources:
  - web
- id: F-LP-006
  topic: Senate ratification of the Louisiana Purchase
  correct: The Senate ratified the Louisiana Purchase treaty Oct 20, 1803, 24–7; the
    House appropriated the funds. Teach the vote with the date — '20 days later' is
    for the flags, not the Senate.
  falsehoods: []
  sources:
  - web
- id: F-LP-007
  topic: Louisiana Purchase price composition and financing
  correct: The $15M was $11.25M in U.S. bonds (6% interest) plus $3.75M in French
    debts owed to Americans assumed by the U.S.; the bonds were underwritten by Baring
    (London) and Hope (Amsterdam). The U.S. borrowed to pay — 'Jefferson bought it
    with cash on hand' is wrong.
  falsehoods:
  - bought louisiana with cash
  - fifteen million.{0,30}(in|with) cash
  sources:
  - web
- id: F-LP-008
  topic: '"doubled the country in a day/overnight" overclaim'
  correct: The purchase doubled the U.S. with the April 30, 1803 treaty signature
    (ratified Oct 20, 1803; possession Dec 20, 1803). 'Doubled overnight/in a day'
    flattens ratification and transfer — teach 'one signature, and the country had
    doubled' or pin the treaty date.
  falsehoods:
  - doubled the country in a day
  - america doubles overnight
  sources:
  - prem27
  - web
- id: F-LP-009
  topic: Haiti's role — disease vs. fighting framing
  correct: 'The Haitian Revolution forced France out: Louverture''s army AND yellow
    fever (which killed Leclerc, Nov 1802, and tens of thousands of French troops).
    Teach both causes — crediting only the disease shortchanges the Haitians; crediting
    only the fighting ignores the epidemic.'
  falsehoods:
  - france sent its best and lost
  sources:
  - prem27
  - web
- id: F-LP-010
  topic: Attribution discipline — Talleyrand's offer and Monroe's $10M mandate are
    NOT princeton ch8
  correct: 'Talleyrand''s offer of ALL Louisiana and Monroe''s authorization to offer
    up to $10M (for New Orleans and West Florida) belong to the standard account per
    senate.gov''s Louisiana Purchase feature + standard textbook accounts. princeton
    ch8 pins only the earlier $2M mandate and never mentions Talleyrand — never attribute
    these two claims to princeton ch8. (Caught 2026-10-06: the v4 Sources footer misattributed
    both to princeton ch8.)'
  falsehoods:
  - talleyrand.{0,40}princeton
  sources:
  - web
- id: F-AOC-001
  topic: Shays' Rebellion causes — debt AND taxes, not one or the other
  correct: Shays' Rebellion (1786-87) was driven by crushing private DEBT plus heavy
    state TAXES, all demanded in hard currency farmers didn't have. Never teach 'debt,
    not taxes' or 'taxes, not debt' as a trap — both books list both causes.
  falsehoods:
  - it wasn't taxes. it was debt
  - debt, not taxes. the farmers
  - shays.*wasn't about taxes
  sources:
  - 5steps
  - prem27
  - norris
- id: F-AOC-002
  topic: 1781 impost — Rhode Island's single no
  correct: 'The 1781 five-percent impost was blocked by RHODE ISLAND''s single rejection
    (12 states approved; unanimity required). Do not name Virginia or New York as
    co-blockers of the 1781 attempt — sources conflict on the later 1783 attempt (Prem27:
    RI+NY; Norris: RI+Virginia). The undisputed core is Rhode Island alone killing
    the 1781 impost.'
  falsehoods: []
  sources:
  - prem27
  - norris
- id: F-AOC-003
  topic: Northwest Ordinance core facts
  correct: 'Northwest Ordinance 1787: surveyed townships sold orderly; one section
    per township reserved for public schools; slavery PROHIBITED north of the Ohio
    River only (not everywhere); 60,000 population → statehood application; new states
    admitted EQUAL to the original thirteen. Called the most consequential legislation
    of the Confederation period.'
  falsehoods:
  - ordinance ended slavery
  - northwest ordinance.*abolished slavery
  sources:
  - 5steps
  - prem27
  - norris
- id: F-AOC-004
  topic: Northwest Indian War sequence
  correct: Little Turtle's confederacy destroyed Harmar's army (1790) and St. Clair's
    army at the Wabash (1791, 600+ killed — worst US Army defeat at Native hands);
    Wayne won at Fallen Timbers (1794); Treaty of Greenville (1795) ceded most of
    Ohio. Keep the sequence in chronological order.
  falsehoods: []
  sources:
  - prem27
  - web
- id: F-RAT-001
  topic: Federalist Papers authorship — Hamilton wrote most
  correct: '85 Federalist essays under the Publius pseudonym (Oct 1787–Aug 1788, aimed
    at NY ratification): HAMILTON wrote 51, MADISON 29, JAY 5. Madison wrote the famous
    ones — Federalist 10 (factions/extended republic) and 51 (ambition counteracting
    ambition). Federalist 78 (judiciary) and 84 (against a bill of rights) are Hamilton''s.
    Never teach ''Madison wrote the Federalist Papers'' as the bulk author.'
  falsehoods:
  - madison wrote (most of|the bulk of|51 of) the federalist
  - madison wrote the federalist papers
  sources:
  - prem27
  - britannica
- id: F-RAT-002
  topic: Ratification needed 9 of 13, not unanimity
  correct: Article VII required NINE of thirteen states to ratify — not unanimity
    (the Articles' rule the framers deliberately abandoned). New Hampshire was the
    9th (June 21, 1788).
  falsehoods:
  - all thirteen states had to ratify
  - ratification required unanimity
  sources:
  - prem27
  - web
- id: F-RAT-003
  topic: Ratification vote margins — MA/VA/NY; NH margin disputed
  correct: Massachusetts 187–168 (Feb 6, 1788; Hancock's recommend-amendments deal
    broke the deadlock); Virginia 89–79 (June 25, 1788); New York 30–27 (July 26,
    1788). New Hampshire was the 9th state (June 21, 1788) — do NOT pin its margin;
    sources disagree (57–47 vs 57–46). North Carolina rejected then ratified (1789);
    Rhode Island last (1790), having rejected the Constitution in town-meeting votes
    without calling a convention.
  falsehoods:
  - new hampshire 57 to 47
  sources:
  - prem27
  - web
- id: F-RAT-004
  topic: Bill of Rights came AFTER ratification, as a promise kept
  correct: The Bill of Rights was NOT in the original Constitution. The First Congress
    proposed 12 amendments; the states ratified 10 by 1791. Massachusetts (and others)
    ratified on the Federalist PROMISE of amendments — the promise was the price of
    ratification.
  falsehoods:
  - the bill of rights was (part of|in) the original constitution
  - the framers included the bill of rights (in|at) philadelphia
  sources:
  - prem27
  - norris
- id: F-RAT-005
  topic: Henry 'smelt a rat' — declining the Convention
  correct: 'Patrick Henry was elected a Virginia delegate to the Constitutional Convention
    but DECLINED to attend; asked why, he said ''I smelt a rat.'' He then led the
    Anti-Federalist opposition at the Virginia ratifying convention (June 1788). His
    signature arguments: consolidated national government (''We, the people'' vs ''We,
    the states''), no bill of rights, standing armies, elastic ''necessary and proper''
    and supremacy clauses.'
  falsehoods: []
  sources:
  - web
- id: F-CIV-025
  topic: Why the war aim shifted — self-emancipation to Confiscation Acts
  correct: 'The war aim shifted because enslaved people forced it: from the war''s
    first months they escaped plantations and fled to Union lines in large numbers,
    bringing emancipation to the top of the Union''s agenda. Congress answered in
    steps: the Confiscation Acts (1861, 1862) declared enslaved people put to work
    for — then owned by supporters of — the Confederacy ''contraband of war'' the
    Union could seize. Lincoln opposed the acts but did not veto them.'
  falsehoods:
  - lincoln freed the slaves on his own
  - the war was about slavery from the start
  sources:
  - prem27
  - princeton
- id: F-CIV-026
  topic: Lincoln's Greeley letter, August 22, 1862
  correct: 'Lincoln''s reply to Horace Greeley''s ''The Prayer of Twenty Millions''
    (Aug 19, 1862) is dated August 22, 1862 — weeks before the Preliminary Emancipation
    Proclamation, with the draft already in his desk drawer. Verbatim: ''My paramount
    object in this struggle is to save the Union, and is not either to save or to
    destroy slavery. If I could save the Union without freeing any slave I would do
    it.'' Closes with his personal wish ''that all men everywhere could be free.''
    Frame as Union-first official duty vs personal wish.'
  falsehoods: []
  sources:
  - web
- id: F-CIV-027
  topic: Republican wartime economic program — the free-labor vision
  correct: 'With Southern Democrats gone from Congress, Republicans passed the economic
    program the South had blocked: Homestead Act (160 acres, farm it 5 years), Morrill
    Land-Grant Act (land + money for agricultural colleges), Pacific Railway Act (1862,
    land grants to railroad corporations for a transcontinental line), National Banking
    Acts (1863–64, uniform national currency). Frame as the ''free-labor'' ideology
    (prem27), not a random list.'
  falsehoods: []
  sources:
  - prem27
  - princeton
- id: F-CIV-028
  topic: Antietam — tactical draw, strategic Union victory
  correct: Antietam was TACTICALLY a draw (neither army broke) but STRATEGICALLY a
    Union victory — it ended British/French recognition talk and gave Lincoln the
    opening for the preliminary Emancipation Proclamation. Never call it flatly a
    'narrow Union victory' without the tactical-draw qualifier.
  falsehoods:
  - narrow union victory at antietam
  - antietam was a (clear|decisive) union victory
  sources:
  - prem27
  - norris
- id: F-CIV-029
  topic: McClellan's cost — debatable, hedge it
  correct: McClellan's timidity cost the Union dearly, but HOW MUCH time it cost is
    debated among historians — hedge ('exactly how much time, historians still argue'),
    never state 'stretched the war by years' as settled.
  falsehoods:
  - mcclellan stretched the war by years
  - mcclellan's timidity stretched the war
  sources:
  - prem27
- id: F-CIV-030
  topic: Ironclads — the age of the wooden warship was ending, not ended
  correct: 'Hampton Roads (Virginia vs Monitor, March 1862): the Virginia destroyed
    two wooden Union warships, then fought the Monitor to a draw. Frame as ''the age
    of the wooden warship was ending'' — never declare ''wooden navies were finished''
    as a settled verdict.'
  falsehoods:
  - wooden navies were finished
  sources:
  - prem27
- id: F-RAT-006
  topic: Hancock's deal — recommendatory amendments, not a formal bill-of-rights promise
  correct: 'Hancock''s deal (Massachusetts, Feb 1788): ratify now, RECOMMEND amendments
    for the First Congress to consider. Frame as ''ratify now, recommend amendments''
    — never as a formal promise of a bill of rights.'
  falsehoods:
  - hancock promised a bill of rights
  - hancock's deal.*bill of rights.*promise
  sources:
  - prem27
- id: F-RAT-007
  topic: Rhode Island — no ratifying convention; town-meeting referendum rejected
    it
  correct: Rhode Island never called a ratifying convention. It put the Constitution
    to a town-meeting referendum (March 1788), which the Federalists boycotted, and
    voters rejected it (~2,708–237). Ratified last, May 1790, under pressure.
  falsehoods:
  - rhode island never voted on the constitution
  - rhode island.*convention.*ratified
  sources:
  - prem27
- id: F-RAT-008
  topic: John Jay — rheumatism winter 1787-88, wrote no more Papers (but lived on)
  correct: Jay wrote 5 Federalist essays, then fell ill with rheumatism through the
    winter of 1787-88 and wrote no more. 'Went home sick' is fine color — but never
    imply he died or vanished; he later became Chief Justice.
  falsehoods:
  - jay died.*federalist
  sources:
  - founders-online
- id: F-RAT-009
  topic: The Constitution protected slavery — three-fifths, fugitive slave, 1808
  correct: 'The Constitution PROTECTED slavery: the three-fifths clause (Art. I s.2,
    enslaved counted 3/5 for representation), the fugitive slave clause (Art. IV s.2),
    and the slave-trade clause barring Congress from ending importation before 1808
    (Art. I s.9). Any ''the Constitution ended slavery'' framing must carry this half.'
  falsehoods:
  - the constitution (ended|abolished) slavery
  - the constitution was anti-slavery
  sources:
  - prem27
  - constitution-text
- id: F-RAT-010
  topic: Grand Federal Procession — Philadelphia, July 4, 1788
  correct: 'Philadelphia''s Grand Federal Procession, July 4 1788: ~5,000 marchers,
    ~17,000 watching; blacksmiths dragged a working forge beating swords into farm
    tools; a rolling ''Grand Federal Edifice'' with 13 columns — 10 finished, 3 bare,
    for the states still out. Boston/Baltimore/Charleston held smaller versions.'
  falsehoods: []
  sources:
  - web
- id: F-RAT-011
  topic: Brutus 1 — consolidation, not a confederation
  correct: 'Brutus No. 1 (Oct 1787, likely Robert Yates): the Constitution creates
    ''one complete national government,'' not a confederation — via the Necessary
    and Proper + Supremacy clauses, which let Congress expand power at the states''
    expense. The federal-vs-national distinction is the exam hook (cf. Madison, Federalist
    39: ''partly federal, partly national'').'
  falsehoods:
  - brutus supported the constitution
  - brutus.*federalist papers
  sources:
  - web
- id: F-RAT-012
  topic: George Mason refused to sign
  correct: George Mason of Virginia refused to sign the Constitution in Philadelphia
    (Sept 1787) — principally over the missing bill of rights. Name him (with Brutus)
    to show Anti-Federalism wasn't one man's cause.
  falsehoods:
  - george mason signed the constitution
  sources:
  - prem27
- id: F-RAT-013
  topic: Henry's "smelt a rat" — exact wording
  correct: 'Patrick Henry''s actual word was ''smelt'': ''I smelt a rat'' (his reply
    explaining why he declined the Philadelphia Convention). Any script line quoting
    him must use ''smelt,'' not ''smelled,'' or the disclosure claim (''quoted lines
    are his actual words'') fails.'
  falsehoods:
  - smelled a rat
  sources:
  - web
- id: F-RAT-014
  topic: Henry's real slavery argument — implied powers, wartime emancipation
  correct: In the Virginia ratifying convention, Henry warned that among the 'ten
    thousand implied powers' Congress might assume, 'they may, if we be engaged in
    war, liberate every one of your slaves if they please… by men, a majority of whom
    have not a common interest with you.' For Virginia planters, the fear that federal
    power might one day END slavery was an argument AGAINST ratification — slavery
    was a live ratification factor, not a moral aside.
  falsehoods:
  - henry.*shield will the free have
  - slavery was not.*factor.*ratification
  sources:
  - web
- id: F-RAT-015
  topic: Hancock's gout at the Massachusetts convention
  correct: John Hancock, presiding over the Massachusetts ratifying convention (Jan–Feb
    1788), was carried in on a litter / by servants, wrapped in flannels, his gout
    flaring — on Jan 30, 1788. His gout recurred at politically opportune times and
    detractors insinuated it was feigned; his entrance with the ratify-now-amend-later
