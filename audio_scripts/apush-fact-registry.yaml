    correct: "In 1675 Governor Juan Francisco Treviño ordered the arrest of 47 Pueblo medicine men for 'sorcery.' Four were sentenced to death by hanging; three were hanged and one committed suicide. The rest were publicly whipped and imprisoned, then released after the pueblos marched on Santa Fe (Spanish soldiers were away fighting Apaches). Popé was among the freed."
