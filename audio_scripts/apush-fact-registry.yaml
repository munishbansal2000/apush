- id: F-U3-017
  topic: Virtual vs actual representation — Parliament's theory, and its direction
  correct: 'Virtual representation was PARLIAMENT''s theory: members represented the
    entire British Empire, colonists ''virtually represented'' though they never voted
    (prem27; princeton: ''all British subjects regardless of who elected them'').
    DIRECTION: virtual representation was the British RESPONSE to the colonial cry
    (prem27 sequences it as the answer to the protests) — never teach the Stamp Act
    Congress as ''answering'' virtual representation; the line runs Parliament-answers-colonists.
    The colonial answer was actual representation: only their own elected assemblies
    could tax them; Otis''s precept — no Englishman pays taxes without his consent
    — from *The Rights of the British Colonies Asserted and Proved* (princeton). Otis
    did NOT advocate secession/independence; he wanted seats in Parliament or colonial
    self-taxation, and colonists knew a delegation would be too small — they wanted
    the right to determine their own taxes (princeton). In 1765 the colonists denied
    one power, the power to tax, while still calling themselves British subjects (Norris:
    ''the goal was the fullness of rights as British subjects''). Never attribute
    virtual representation to the colonists; never teach Otis as pro-independence.'
