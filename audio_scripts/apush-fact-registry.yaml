  - id: F-U2-050
    topic: Edwards's Enfield sermon — date and spider quote verbatim
    correct: "Jonathan Edwards preached 'Sinners in the Hands of an Angry God' at Enfield, Connecticut, on July 8, 1741 (1741 printed sermon title page, public domain). The spider line is his verbatim wording: 'The God that holds you over the pit of hell, much as one holds a spider, or some loathsome insect, over the fire.' Header disclosure: 'his actual wording, from the 1741 printed sermon.'"
    falsehoods:
      - "Sinners in the Hands of an Angry God.{0,40}(1739|1740|1742)"
      - "holds you over the pit.{0,20}(like|as).{0,20}(a|an) (spider|insect).{0,20}(reworded|paraphrase)"
    sources: [primary_1741_sermon]

  - id: F-U2-051
    topic: Edwards 'read nearly flat' — disclosed reported account
    correct: "The account that Edwards read the sermon 'nearly flat, barely looking up, while the congregation came apart' must be disclosed as reported ('the famous account says'), not stated as established fact. Corroborated by the Historic Northampton Museum: Edwards 'delivered his sermons in a controlled monotone.'"
    falsehoods:
      - "Edwards (shouted|roared|thundered).{0,20}Enfield"
    sources: [historic_northampton]

  - id: F-U2-052
    topic: Northampton dismissal 1750 — communion cause
    correct: "In 1750 Edwards's own congregation at Northampton dismissed him after he tightened who could take communion (requiring a profession of faith, reversing Stoddard's open policy). 'Voted him out' is a fair summary (council 10-9 to dissolve, congregation ratified). Verified via Historic Northampton Museum."
    falsehoods:
      - "Northampton.{0,20}(fired|dismissed).{0,20}(1749|1751|1752)"
    sources: [historic_northampton]

  - id: F-U2-053
    topic: Junto 1727 and Poor Richard's Almanack 1732
    correct: "Franklin founded the Junto in 1727 — a club of tradesmen ('leathern aprons') debating morals and politics, pooling books into what became the Library Company (1731). Poor Richard's Almanack ran from 1732 for twenty-five years (Autobiography). 'A penny saved is a penny earned' is from the Almanack (princeton ch.6)."
    falsehoods:
      - "Junto.{0,20}(1730|1740)"
      - "Poor Richard.{0,20}(1725|1740)"
    sources: [franklin_autobiography, princeton]

  - id: F-U2-054
    topic: "Most famous sermon in American history — attribute the superlative"
    correct: "The superlative 'the most famous sermon in American history' (for 'Sinners in the Hands of an Angry God') must be attributed — 'what's often called the most famous sermon in American history' — never stated flat. Per F-U2-022 discipline: attributed labels, never flat facts."
    falsehoods:
      - "he preached the most famous sermon in American history"
    sources: [web]

  - id: F-U2-055
    topic: Zenger trial mechanics — De Lancey, Hamilton, and the law that didn't change
    correct: "Zenger was arrested November 1734 and tried in August 1735. Cosby's chief justice James De Lancey disbarred Zenger's original lawyers and instructed the jury that publication alone was guilt (truth barred). Andrew Hamilton of Philadelphia defended, arguing truth should be the defense — counter to English law, where a true libel was worse ('the greater the truth, the greater the scandal'). The jury acquitted anyway. The verdict did NOT change libel law in America or Britain. Hamilton's summation wording ('one poor printer... cause of liberty') is his actual 1735 wording, lightly trimmed. Never teach that the trial made truth a legal defense."
    falsehoods:
      - "zenger.*(changed|reformed|rewrote) the (libel )?law"
      - "the trial made truth (a )?legal defense"
      - "truth became the defense.*1735"
    sources: [prem27, norris, web]

  - id: F-U2-056
    topic: Massachusetts salary fights — Shute, Burnet, and the £1,700 grant
    correct: "Massachusetts in the 1720s resisted pressure to regularize royal governors' salaries (5steps). Governor Samuel Shute demanded a permanent salary; the House refused and voted his pay year by year. Governor William Burnet renewed the demand; in September 1728 the House granted him seventeen hundred pounds 'to enable him to manage the public affairs' while refusing the fixed, stated salary. This is the 'power of the purse' case study — leverage, not sovereignty."
    falsehoods:
      - "shute.*(got|won|received).*(permanent|fixed) salary"
      - "burnet.*(got|won|received).*(permanent|fixed) salary"
      - "massachusetts.*voted.*permanent salary.*1720s"
    sources: [5steps, web]

  - id: F-U2-057
    topic: Knowles impressment riot, Boston, November 17–19, 1747
    correct: "Three-day riot (Nov 17–19, 1747): Admiral Charles Knowles's press gangs seized about 46 Bostonians — sailors and non-sailors alike — for the Royal Navy; hundreds of Bostonians rampaged. The largest impressment riot in colonial North America. Tier 1–2 silent on it; verified across multiple secondary/scholarly accounts — label honestly as web-verified."
    falsehoods:
      - "knowles riot.*1765"
      - "knowles.*(one day|a single day).*riot"
    sources: [web]

  - id: F-U2-058
    topic: Cosby dismissed Judge Lewis Morris after a salary-dispute ruling
    correct: "The Zenger coverage began when Governor William Cosby dismissed Judge Lewis Morris after Morris ruled against him in a salary dispute (Heimler: Zenger published 'a piece criticizing the dismissal of an American judge by the corrupt British-appointed governor'). The salary-dispute cause links the Zenger box to the power-of-the-purse box. Tier 1 gives the dismissal; the salary cause is web-verified."
    falsehoods:
      - "cosby dismissed morris.*(corruption|bribery)"
    sources: [norris, web]

  - id: F-U2-059
    topic: Anna Zenger kept the paper printing during the imprisonment
    correct: "Zenger sat in jail the better part of a year awaiting trial (Nov 1734–Aug 1735); his wife Anna kept the New-York Weekly Journal printing without him. Standard, uncontested detail; web-verified, not in Tier 1."
    falsehoods:
      - "zenger's paper.*(stopped|ceased).*while.*jail"
    sources: [web]

  - id: F-U2-060
    topic: Colonial legislatures modeled on Parliament — purse = salaries + tax legislation
    correct: "Princeton (Tier 1): colonial legislatures were bicameral, 'modeled after the British Parliament'; the elected lower house's powers included the 'power of the purse' (control over government salaries and tax legislation); the upper house was appointed and advised the governor. Use for the 'little parliament' framing — the book's words are 'modeled after,' not 'little parliaments.'"
    falsehoods:
      - "colonial.*upper house.*elected"
      - "power of the purse.*controlled trade regulations"
    sources: [princeton]

  - id: F-U2-061
    topic: Washington's age at Jumonville Glen — 22, not Britannica's 21
    correct: "Washington was 22 on May 28, 1754: born February 22, 1732, the arithmetic gives 22. Britannica's Jumonville article says he was 'only 21' — a book error. DEPARTURE FROM TIER 2, sanctioned by the arithmetic and by continuity (U2-E7's forward tease names a twenty-two-year-old Washington). Scripts use 22 and flag the discrepancy in the footer only, never in dialogue."
    falsehoods:
      - "washington was (only )?21[^0-9]"
    sources: [britannica, web]

  - id: F-U2-062
    topic: Treaty of Paris 1763 — France kept Guadeloupe and Martinique
    correct: "In the 1763 Treaty of Paris France kept its Caribbean sugar colonies Guadeloupe and Martinique while ceding Canada and everything east of the Mississippi to Britain. BEYOND Tier 1+2 strictly (Tier 1 is silent on the retained islands); sanctioned by CED coverage. Dialogue characterization 'France traded a continent for sugar' is fair. Never write that France 'lost everything in North America.'"
    falsehoods:
      - "france lost everything in north america"
    sources: [web]

  - id: F-U2-063
    topic: Albany Plan rejected by the colonies first, not vetoed by Parliament
    correct: "Franklin's Albany Plan of Union (1754) was rejected FIRST by the colonial assemblies — they guarded their own power/sovereignty — and then also rejected by London. Never teach that Parliament vetoed it, and never frame the rejection as mere colonial disorganization."
    falsehoods:
      - "parliament vetoed the albany plan"
      - "albany plan.*vetoed by parliament"
      - "colonies were (just|merely|simply) disorganized.*albany"
    sources: [5steps, prem27]

  - id: F-U2-064
    topic: Post-war British debt — no pinned figure in Tier 1+2
    correct: "The British debt after the Seven Years' War is described in Tier 1 sources only as 'large'/'enormous' — no pinned figure is verifiable in Tier 1+2. Scripts use the books' language only ('an enormous debt'), never a number."
    falsehoods:
      - "130 million pounds"
      - "debt.*(roughly|nearly|about).*(doubled|double)"
    sources: [prem27, 5steps]

  - id: F-U2-065
    topic: Chesapeake demography — hedged textbook figures, never pins
    correct: "Early Chesapeake: malaria, dysentery, and typhoid cut roughly ten years off a newcomer's life expectancy; men outnumbered women roughly six to one around 1650, narrowing toward three to two by 1700; marriages were often broken by death within seven years; roughly half the children born did not live to twenty; Virginia held nearly 60,000 people by 1700, the most populous English colony. Always hedged (roughly/toward/nearly) — the source is the classic American Pageant (Kennedy) ch. 4 treatment, a standard AP textbook, NOT Tier 1+2. Never pin the ratios or the life-expectancy figure."
    falsehoods:
      - "men outnumbered women exactly six to one"
      - "chesapeake.*(stable|strong|healthy) families.*1600s"
      - "chesapeake.*grew.*natural increase.*1600s"
    sources: [web]

  - id: F-U2-066
    topic: 1644 second attack and 1646 treaty — Powhatan power broken
    correct: "1644: Opechancanough (Powhatan's brother, now an old man) led a second attack on Virginia; the English crushed it, captured him in 1646, and he was killed while a prisoner. The 1646 treaty drew a boundary, set aside reservation land, and demanded tribute — Powhatan power was broken. Tier 1 confirms the 1644 war and the precipitous decline (prem27) and the Powhatan Wars span 1610-1677 (princeton); the capture/killing/treaty details are standard accounts, hedged in dialogue. Never teach that the Powhatan story ends in 1622."
    falsehoods:
      - "powhatan.*(vanished|disappeared|destroyed).*(in )?1622"
      - "1644.*powhatan.*(victory|drove out the english|succeeded)"
    sources: [prem27, princeton, web]

  - id: F-U2-067
    topic: Maryland — Catholic refuge that ran Virginia's tobacco playbook
    correct: "Maryland: charter 1632 to George Calvert, Lord Baltimore (Charles I); first settlers 1634; first proprietary colony (one owner, not a company). Calvert wanted a Catholic refuge AND tobacco profits — he got the tobacco. Maryland ran Virginia's playbook: tobacco, indentured servants, enslaved Africans (prem27: 'Maryland bore similarities to Virginia'). Protestants outnumbered Catholics almost immediately; the Act of Toleration (1649) protected Christian worship — the Catholics needed the law in their own colony. Never teach that Maryland stayed Catholic."
    falsehoods:
      - "maryland.*stayed catholic"
      - "maryland.*remained.*catholic.*(colony|refuge)"
    sources: [prem27, 5steps, princeton]

  - id: F-U2-068
    topic: Smith's Generall Historie (1624) — the rescue first appears ~17 years later
    correct: "Smith's Pocahontas rescue first appears in his Generall Historie (1624), roughly seventeen years after the events — absent from his earlier accounts. Scholars split: invented outright vs misunderstood adoption ritual; never teach as settled (F-U1-029). The exam device: when the source is Smith writing about Smith, read the author before the story (source criticism, not recall)."
    falsehoods:
      - "rescue.*first.*(told|described|published).*(1608|1609|1610)"
      - "generall historie.*(1608|1610)"
    sources: [5steps, britannica]
