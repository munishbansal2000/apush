  - id: F-U1-055
    topic: 1692 negotiated return vs 1693 force retaking — not a clean bloodless reconquest
    correct: "1692: Vargas entered Santa Fe and negotiated — clemency, pardons, respect for Pueblo lands (bloodless per Spanish accounts). 1693: he returned with colonists and retook Santa Fe by force; Spanish accounts record dozens of Pueblo men executed. Never teach 1692 as a final clean reconquest, and never swap the years."
    falsehoods:
      - "1692.{0,40}bloodless and final"
