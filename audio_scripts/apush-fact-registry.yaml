  - id: F-U2-012
    topic: Virginia slave code 1705 — specifics
    correct: "Virginia's 1705 code: servants imported who were not Christians in their native country counted as slaves; enslaved people were 'held to be real estate' (the statute's word is real estate, NOT chattels — property, passed to heirs like land); a master who killed an enslaved worker during punishment faced no prosecution ('as if such accident never happened'). Virginia's code became the model other colonies copied. The code consolidated decades of one-off laws (1640, 1662, 1667) — it did not invent slavery."
    falsehoods:
      - "1705.*(invented|started|began) slavery"
      - "the 1705 code.*freed.*baptism"
