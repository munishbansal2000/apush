# Fish Audio voice ids — fill in ONCE, then never touch again.
#
# Where to find them: fish.audio dashboard -> open the voice you use for Maya ->
# copy its model id (a short string). Same for Marcus.
#
# These are public voice-model identifiers, not secrets. The API KEY itself is
# never stored here: on Windows set the FISH_API_KEY environment variable; on
# the Linux VM the Secure Vault credential is used automatically.

maya: "PASTE_MAYA_VOICE_ID"
marcus: "PASTE_MARCUS_VOICE_ID"

# Fish model for synthesis. s2.1-pro-free covers TTS on the current plan.
model: "s2.1-pro-free"
