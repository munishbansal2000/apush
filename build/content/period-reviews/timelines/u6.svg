<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="400" viewBox="0 0 1240 400" role="img" aria-label="Unit 6 (1865-1898): The Gilded Age timeline">
<rect x="0" y="0" width="1240" height="400" fill="#faf8f2"/>
<text x="620.0" y="30" text-anchor="middle" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" font-size="22" font-weight="bold" fill="#2b2b2b">Unit 6 (1865-1898): The Gilded Age</text>
<line x1="60" y1="190" x2="1200" y2="190" stroke="#555" stroke-width="2"/>
<text x="60" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">1865</text>
<text x="1200" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">1898</text>
<line x1="198.2" y1="190" x2="198.2" y2="182" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="198.2" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="198.2" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1869</text>
<text x="198.2" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Transcontinental railroad</text>
<text x="198.2" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Completed May 10 at Promontory, Utah</text>
<line x1="198.2" y1="100" x2="198.2" y2="182" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="336.4" y1="190" x2="336.4" y2="198" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="336.4" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="336.4" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1873</text>
<text x="336.4" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Panic of 1873</text>
<text x="336.4" y="334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Railroad crash opens a long depression</text>
<line x1="336.4" y1="198" x2="336.4" y2="292" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="440.0" y1="190" x2="440.0" y2="182" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="440.0" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="440.0" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1876</text>
<text x="440.0" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Little Bighorn / telephone</text>
<text x="440.0" y="146" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Custer defeated; Bell patents the telephone</text>
<line x1="440.0" y1="152" x2="440.0" y2="182" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="474.5" y1="190" x2="474.5" y2="198" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="474.5" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="474.5" y="248" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1877</text>
<text x="474.5" y="266" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Railroad Strike / Munn</text>
<text x="474.5" y="282" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">First nationwide strike crushed; Court upholds grain-rate laws</text>
<line x1="474.5" y1="198" x2="474.5" y2="240" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="647.3" y1="190" x2="647.3" y2="182" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="647.3" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="647.3" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1882</text>
<text x="647.3" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Chinese Exclusion Act</text>
<text x="647.3" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">First federal law banning an immigrant group by nationality</text>
<line x1="647.3" y1="100" x2="647.3" y2="182" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="785.5" y1="190" x2="785.5" y2="198" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="785.5" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="785.5" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1886</text>
<text x="785.5" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Haymarket / AFL</text>
<text x="785.5" y="334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Bomb kills police at labor rally; craft-union federation founded</text>
<line x1="785.5" y1="198" x2="785.5" y2="292" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="820.0" y1="190" x2="820.0" y2="182" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="820.0" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="820.0" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1887</text>
<text x="820.0" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">ICC / Dawes Act</text>
<text x="820.0" y="146" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Railroads regulated; tribal lands broken into allotments</text>
<line x1="820.0" y1="152" x2="820.0" y2="182" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="923.6" y1="190" x2="923.6" y2="198" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="923.6" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="923.6" y="248" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1890</text>
<text x="923.6" y="266" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Sherman Act / Wounded Knee</text>
<text x="923.6" y="282" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Antitrust law passed; Army kills ~300 Lakota, Dec 29</text>
<line x1="923.6" y1="198" x2="923.6" y2="240" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="992.7" y1="190" x2="992.7" y2="182" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="992.7" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="992.7" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1892</text>
<text x="992.7" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Homestead / Populists</text>
<text x="992.7" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Strike crushed at Carnegie steel; Omaha Platform demands reforms</text>
<line x1="992.7" y1="100" x2="992.7" y2="182" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="1027.3" y1="190" x2="1027.3" y2="198" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="1027.3" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="1027.3" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1893</text>
<text x="1027.3" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Panic of 1893</text>
<text x="1027.3" y="334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Worst depression yet; unemployment soars</text>
<line x1="1027.3" y1="198" x2="1027.3" y2="292" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="1061.8" y1="190" x2="1061.8" y2="182" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="1061.8" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="1061.8" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1894</text>
<text x="1061.8" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Pullman Strike</text>
<text x="1061.8" y="146" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Federal troops break the railroad strike; Debs jailed</text>
<line x1="1061.8" y1="152" x2="1061.8" y2="182" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="1130.9" y1="190" x2="1130.9" y2="198" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="1130.9" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="1130.9" y="248" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1896</text>
<text x="1130.9" y="266" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Plessy / McKinley wins</text>
<text x="1130.9" y="282" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">&#x27;Separate but equal&#x27; upheld; gold defeats free silver</text>
<line x1="1130.9" y1="198" x2="1130.9" y2="240" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="1200.0" y1="190" x2="1200.0" y2="182" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="1200.0" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="1200.0" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1898</text>
<text x="1200.0" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Spanish-American War</text>
<text x="1200.0" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">U.S. defeats Spain; takes overseas colonies</text>
<line x1="1200.0" y1="100" x2="1200.0" y2="182" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
