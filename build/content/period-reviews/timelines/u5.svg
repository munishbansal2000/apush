<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="400" viewBox="0 0 1240 400" role="img" aria-label="Unit 5 (1844-1877): Expansion, Disunion, Reconstruction timeline">
<rect x="0" y="0" width="1240" height="400" fill="#faf8f2"/>
<text x="620.0" y="30" text-anchor="middle" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" font-size="22" font-weight="bold" fill="#2b2b2b">Unit 5 (1844-1877): Expansion, Disunion, Reconstruction</text>
<line x1="60" y1="190" x2="1200" y2="190" stroke="#555" stroke-width="2"/>
<text x="60" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">1844</text>
<text x="1200" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">1877</text>
<line x1="60.0" y1="190" x2="60.0" y2="182" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="60.0" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="60.0" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1844</text>
<text x="60.0" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Polk elected</text>
<text x="60.0" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Runs on expansion: Texas and Oregon</text>
<line x1="60.0" y1="100" x2="60.0" y2="182" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="94.5" y1="190" x2="94.5" y2="198" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="94.5" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="94.5" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1845</text>
<text x="94.5" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Texas annexed</text>
<text x="94.5" y="334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Admitted as a slave state, Dec 1845</text>
<line x1="94.5" y1="198" x2="94.5" y2="292" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="129.1" y1="190" x2="129.1" y2="182" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="129.1" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="129.1" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1846</text>
<text x="129.1" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Mexican War begins</text>
<text x="129.1" y="146" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Declared May 1846; Wilmot Proviso ties slavery to new land</text>
<line x1="129.1" y1="152" x2="129.1" y2="182" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="198.2" y1="190" x2="198.2" y2="198" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="198.2" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="198.2" y="248" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1848</text>
<text x="198.2" y="266" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Treaty of Guadalupe Hidalgo</text>
<text x="198.2" y="282" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Signed Feb 2; $15M buys the Mexican Cession; gold found in California</text>
<line x1="198.2" y1="198" x2="198.2" y2="240" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="267.3" y1="190" x2="267.3" y2="182" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="267.3" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="267.3" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1850</text>
<text x="267.3" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Compromise of 1850</text>
<text x="267.3" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">California free; strict Fugitive Slave Act</text>
<line x1="267.3" y1="100" x2="267.3" y2="182" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="405.5" y1="190" x2="405.5" y2="198" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="405.5" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="405.5" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1854</text>
<text x="405.5" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Kansas-Nebraska Act</text>
<text x="405.5" y="334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Popular sovereignty repeals the Missouri Compromise line</text>
<line x1="405.5" y1="198" x2="405.5" y2="292" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="509.1" y1="190" x2="509.1" y2="182" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="509.1" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="509.1" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1857</text>
<text x="509.1" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Dred Scott decision</text>
<text x="509.1" y="146" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Court: Congress cannot ban slavery in territories</text>
<line x1="509.1" y1="152" x2="509.1" y2="182" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="612.7" y1="190" x2="612.7" y2="198" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="612.7" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="612.7" y="248" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1860</text>
<text x="612.7" y="266" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Lincoln elected</text>
<text x="612.7" y="282" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Wins with ~40% of vote; South Carolina secedes Dec 1860</text>
<line x1="612.7" y1="198" x2="612.7" y2="240" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="647.3" y1="190" x2="647.3" y2="182" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="647.3" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="647.3" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1861</text>
<text x="647.3" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Fort Sumter</text>
<text x="647.3" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Fired on Apr 12; Civil War begins</text>
<line x1="647.3" y1="100" x2="647.3" y2="182" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="716.4" y1="190" x2="716.4" y2="198" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="716.4" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="716.4" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1863</text>
<text x="716.4" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Emancipation / Gettysburg</text>
<text x="716.4" y="334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Proclamation takes effect Jan 1; Union wins at Gettysburg, July</text>
<line x1="716.4" y1="198" x2="716.4" y2="292" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="785.5" y1="190" x2="785.5" y2="182" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="785.5" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="785.5" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1865</text>
<text x="785.5" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">War ends; 13th Amendment</text>
<text x="785.5" y="146" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Lee surrenders Apr 9; slavery abolished Dec 1865</text>
<line x1="785.5" y1="152" x2="785.5" y2="182" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="889.1" y1="190" x2="889.1" y2="198" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="889.1" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="889.1" y="248" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1868</text>
<text x="889.1" y="266" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">14th Amendment ratified</text>
<text x="889.1" y="282" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Citizenship + equal protection; Johnson acquitted in impeachment</text>
<line x1="889.1" y1="198" x2="889.1" y2="240" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="958.2" y1="190" x2="958.2" y2="182" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="958.2" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="958.2" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1870</text>
<text x="958.2" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">15th Amendment ratified</text>
<text x="958.2" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Black male suffrage written into the Constitution</text>
<line x1="958.2" y1="100" x2="958.2" y2="182" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="1200.0" y1="190" x2="1200.0" y2="198" stroke="#8a6d3b" stroke-width="2.5"/>
<circle cx="1200.0" cy="190" r="4.5" fill="#8a6d3b" stroke="#faf8f2" stroke-width="1.5"/>
<text x="1200.0" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2b2b2b">1877</text>
<text x="1200.0" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5c2e">Compromise of 1877</text>
<text x="1200.0" y="334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555">Federal troops leave the South; Reconstruction ends</text>
<line x1="1200.0" y1="198" x2="1200.0" y2="292" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
