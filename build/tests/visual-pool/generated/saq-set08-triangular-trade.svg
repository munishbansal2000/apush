<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520"><style>text{font-family:Georgia,'Times New Roman',serif;}.t{font-size:20px;font-weight:bold;fill:#111111;}.l{font-size:15px;fill:#111111;}.s{font-size:13px;fill:#333333;}.n{font-size:15px;font-weight:bold;fill:#111111;}.hs{font-size:13px;fill:#ffffff;}</style><rect x="0" y="0" width="760" height="520" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1a5276"/></marker></defs><text x="380" y="36" class="t" text-anchor="middle">The Triangular Trade, 1700s</text><rect x="300" y="60" width="160" height="52" rx="8" fill="#d6eaf8" stroke="#1a5276" stroke-width="2"/><text x="380" y="92" class="n" text-anchor="middle">New England</text><rect x="60" y="380" width="160" height="52" rx="8" fill="#fdebd0" stroke="#935116" stroke-width="2"/><text x="140" y="412" class="n" text-anchor="middle">West Africa</text><rect x="540" y="380" width="160" height="52" rx="8" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/><text x="620" y="412" class="n" text-anchor="middle">West Indies</text><line x1="300" y1="95" x2="160" y2="370" stroke="#1a5276" stroke-width="3" marker-end="url(#ah)"/><text x="205" y="235" class="l" text-anchor="middle" fill="#1a5276">rum and manufactured goods</text><line x1="240" y1="406" x2="530" y2="406" stroke="#935116" stroke-width="3" marker-end="url(#ah)"/><text x="385" y="392" class="l" text-anchor="middle" fill="#935116">enslaved Africans (Middle Passage)</text><line x1="600" y1="370" x2="470" y2="100" stroke="#1e8449" stroke-width="3" marker-end="url(#ah)"/><text x="560" y="235" class="l" text-anchor="middle" fill="#1e8449">sugar and molasses</text></svg>