<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"><style>text{font-family:Georgia,'Times New Roman',serif;}.t{font-size:20px;font-weight:bold;fill:#111111;}.l{font-size:15px;fill:#111111;}.s{font-size:13px;fill:#333333;}.n{font-size:15px;font-weight:bold;fill:#111111;}.hs{font-size:13px;fill:#ffffff;}</style><rect x="0" y="0" width="900" height="320" fill="#ffffff"/><text x="450" y="36" class="t" text-anchor="middle">The United States, 1803-1815</text><line x1="120" y1="190" x2="790" y2="190" stroke="#1a5276" stroke-width="4"/><circle cx="120.0" cy="190" r="7" fill="#c0392b"/><line x1="120.0" y1="190" x2="120.0" y2="154" stroke="#7f8c8d" stroke-width="1.5"/><text x="120.0" y="138" class="n" text-anchor="middle">1803 - Louisiana Purchase</text><text x="120.0" y="160" class="s" text-anchor="middle">France sells Louisiana to the U.S.</text><circle cx="343.3333333333333" cy="190" r="7" fill="#c0392b"/><line x1="343.3333333333333" y1="190" x2="343.3333333333333" y2="224" stroke="#7f8c8d" stroke-width="1.5"/><text x="343.3333333333333" y="262" class="n" text-anchor="middle">1807 - Embargo Act</text><text x="343.3333333333333" y="284" class="s" text-anchor="middle">halts American trade with Britain and France</text><circle cx="622.5" cy="190" r="7" fill="#c0392b"/><line x1="622.5" y1="190" x2="622.5" y2="154" stroke="#7f8c8d" stroke-width="1.5"/><text x="622.5" y="138" class="n" text-anchor="middle">1812 - War of 1812</text><text x="622.5" y="160" class="s" text-anchor="middle">with Britain, 1812-1815</text><circle cx="734.1666666666666" cy="190" r="7" fill="#c0392b"/><line x1="734.1666666666666" y1="190" x2="734.1666666666666" y2="224" stroke="#7f8c8d" stroke-width="1.5"/><text x="734.1666666666666" y="262" class="n" text-anchor="middle">1814 - Hartford Convention</text><text x="734.1666666666666" y="284" class="s" text-anchor="middle">anti-war Federalists meet</text><circle cx="790.0" cy="190" r="7" fill="#c0392b"/><line x1="790.0" y1="190" x2="790.0" y2="98" stroke="#7f8c8d" stroke-width="1.5"/><text x="790.0" y="82" class="n" text-anchor="middle">1815 - New Orleans</text><text x="790.0" y="104" class="s" text-anchor="middle">victory makes Jackson a hero</text></svg>