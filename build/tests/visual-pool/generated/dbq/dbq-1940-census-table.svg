<svg xmlns="http://www.w3.org/2000/svg" width="640" height="476" viewBox="0 0 640 476">
<rect x="0" y="0" width="640" height="476" fill="#ffffff"/>
<rect x="6" y="6" width="628" height="464" fill="none" stroke="#222" stroke-width="3"/>
<text x="320" y="36" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="bold" fill="#111">Population of the United States and Its Territories and Possessions</text>
<text x="320" y="60" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#333">U.S. Census Bureau, 1940 (selected figures)</text>
<rect x="40" y="96" width="560" height="34" fill="#dfe6ee" stroke="#222" stroke-width="2"/>
<text x="60" y="119" font-family="Georgia,serif" font-size="15" font-weight="bold" fill="#111">Territory / Possession</text>
<text x="580" y="119" text-anchor="end" font-family="Georgia,serif" font-size="15" font-weight="bold" fill="#111">1940 Population</text>
<rect x="40" y="130" width="560" height="34" fill="#f4f6f9" stroke="#222" stroke-width="2"/>
<text x="60" y="153" font-family="Georgia,serif" font-size="14" fill="#111">Philippines</text>
<text x="580" y="153" text-anchor="end" font-family="Georgia,serif" font-size="14" fill="#111">16,356,000</text>
<rect x="40" y="164" width="560" height="34" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="60" y="187" font-family="Georgia,serif" font-size="14" fill="#111">Puerto Rico</text>
<text x="580" y="187" text-anchor="end" font-family="Georgia,serif" font-size="14" fill="#111">1,869,255</text>
<rect x="40" y="198" width="560" height="34" fill="#f4f6f9" stroke="#222" stroke-width="2"/>
<text x="60" y="221" font-family="Georgia,serif" font-size="14" fill="#111">Hawaii</text>
<text x="580" y="221" text-anchor="end" font-family="Georgia,serif" font-size="14" fill="#111">423,330</text>
<rect x="40" y="232" width="560" height="34" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="60" y="255" font-family="Georgia,serif" font-size="14" fill="#111">Alaska</text>
<text x="580" y="255" text-anchor="end" font-family="Georgia,serif" font-size="14" fill="#111">72,524</text>
<rect x="40" y="266" width="560" height="34" fill="#f4f6f9" stroke="#222" stroke-width="2"/>
<text x="60" y="289" font-family="Georgia,serif" font-size="14" fill="#111">Panama Canal Zone</text>
<text x="580" y="289" text-anchor="end" font-family="Georgia,serif" font-size="14" fill="#111">51,827</text>
<rect x="40" y="300" width="560" height="34" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="60" y="323" font-family="Georgia,serif" font-size="14" fill="#111">Guam</text>
<text x="580" y="323" text-anchor="end" font-family="Georgia,serif" font-size="14" fill="#111">22,290</text>
<rect x="40" y="334" width="560" height="34" fill="#f4f6f9" stroke="#222" stroke-width="2"/>
<text x="60" y="357" font-family="Georgia,serif" font-size="14" fill="#111">Virgin Islands</text>
<text x="580" y="357" text-anchor="end" font-family="Georgia,serif" font-size="14" fill="#111">24,889</text>
<rect x="40" y="368" width="560" height="34" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="60" y="391" font-family="Georgia,serif" font-size="14" fill="#111">American Samoa</text>
<text x="580" y="391" text-anchor="end" font-family="Georgia,serif" font-size="14" fill="#111">12,908</text>
<text x="40" y="428" font-family="Georgia,serif" font-size="12" font-style="italic" fill="#333">Territories and possessions exclusive of the Philippines totaled 2,477,023 in 1940,</text>
<text x="40" y="446" font-family="Georgia,serif" font-size="12" font-style="italic" fill="#333">up from 1,680,202 in 1920.</text>
</svg>