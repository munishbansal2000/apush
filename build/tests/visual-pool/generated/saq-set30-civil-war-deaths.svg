<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420"><style>text{font-family:Georgia,'Times New Roman',serif;}.t{font-size:20px;font-weight:bold;fill:#111111;}.l{font-size:15px;fill:#111111;}.s{font-size:13px;fill:#333333;}.n{font-size:15px;font-weight:bold;fill:#111111;}.hs{font-size:13px;fill:#ffffff;}</style><rect x="0" y="0" width="640" height="420" fill="#ffffff"/><text x="320" y="36" class="t" text-anchor="middle">Military Deaths in the Civil War, 1861-1865</text><line x1="80" y1="330" x2="560" y2="330" stroke="#333333" stroke-width="2"/><rect x="175" y="96.0" width="110" height="234.0" fill="#2874a6"/><text x="230.0" y="84.0" class="n" text-anchor="middle">360,000</text><text x="230.0" y="358" class="l" text-anchor="middle">Union</text><rect x="375" y="161.0" width="110" height="169.0" fill="#943634"/><text x="430.0" y="149.0" class="n" text-anchor="middle">260,000</text><text x="430.0" y="358" class="l" text-anchor="middle">Confederate</text><text x="320" y="392" class="s" text-anchor="middle">Disease was the largest single cause of death in both armies, ahead of battle wounds.</text></svg>