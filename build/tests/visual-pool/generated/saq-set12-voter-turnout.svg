<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"><style>text{font-family:Georgia,'Times New Roman',serif;}.t{font-size:20px;font-weight:bold;fill:#111111;}.l{font-size:15px;fill:#111111;}.s{font-size:13px;fill:#333333;}.n{font-size:15px;font-weight:bold;fill:#111111;}.hs{font-size:13px;fill:#ffffff;}</style><rect x="0" y="0" width="720" height="360" fill="#ffffff"/><text x="360" y="36" class="t" text-anchor="middle">Voter Participation in Presidential Elections</text><rect x="100" y="60" width="520" height="44" fill="#1a5276"/><text x="230" y="88" class="hs" text-anchor="middle">Election</text><text x="490" y="88" class="hs" text-anchor="middle">Eligible voters casting ballots</text><rect x="100" y="104" width="520" height="44" fill="#eaf2f8" stroke="#1a5276"/><text x="230" y="133" class="n" text-anchor="middle">1824</text><text x="490" y="133" class="n" text-anchor="middle">about 27%</text><rect x="100" y="148" width="520" height="44" fill="#ffffff" stroke="#1a5276"/><text x="230" y="177" class="n" text-anchor="middle">1828</text><text x="490" y="177" class="n" text-anchor="middle">about 58%</text><rect x="100" y="192" width="520" height="44" fill="#eaf2f8" stroke="#1a5276"/><text x="230" y="221" class="n" text-anchor="middle">1840</text><text x="490" y="221" class="n" text-anchor="middle">about 80%</text><text x="360" y="268" class="s" text-anchor="middle">The sharp rise coincides with the elimination of property qualifications</text><text x="360" y="290" class="s" text-anchor="middle">for voting in most states during the Jacksonian era.</text></svg>