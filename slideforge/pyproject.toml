[project]
name = "slideforge"
version = "0.2.0"
description = "A tiny reusable engine for animated slide videos (PIL + numpy + ffmpeg)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow",
    "numpy",
]

[project.scripts]
slideforge = "slideforge.cli:main"

# Third-party plugin entry points. Example:
# [project.entry-points."slideforge.slides"]
# my-slide = "my_package:MySlide"
[project.entry-points."slideforge.slides"]
[project.entry-points."slideforge.transitions"]
[project.entry-points."slideforge.backgrounds"]
[project.entry-points."slideforge.visions"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["slideforge*"]
